<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14161D"/>
      <stop offset="1" stop-color="#090A0E"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="16" y1="19" x2="74" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="16" y1="64" x2="112" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="emeraldGlow" x="6" y="38" width="116" height="52" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="31.5" stroke="#252A36" stroke-width="1.5"/>

  <!-- Top Bar (Scanning Field) -->
  <rect x="16" y="19" width="96" height="25" rx="12.5" fill="#181F38"/>
  <rect x="16" y="19" width="58" height="25" rx="12.5" fill="url(#scanGrad)"/>

  <!-- Middle Bar (Enlarged Active Emerald Lock & Focal Dot) -->
  <rect x="16" y="51" width="96" height="27" rx="13.5" fill="url(#fillGrad)" filter="url(#emeraldGlow)"/>
  <rect x="16" y="51" width="96" height="27" rx="13.5" fill="url(#fillGrad)"/>
  <circle cx="64" cy="64.5" r="6.5" fill="#FFFFFF"/>

  <!-- Bottom Bar (Neutral Field & Anchor Dot) -->
  <rect x="16" y="85" width="96" height="25" rx="12.5" fill="#212532"/>
  <circle cx="30" cy="97.5" r="5" fill="#64748B"/>
</svg>
